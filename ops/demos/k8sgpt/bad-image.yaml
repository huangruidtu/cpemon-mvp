apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8sgpt-demo-bad-image
  namespace: cpemon
  labels:
    app.kubernetes.io/name: k8sgpt-demo-bad-image
    app.kubernetes.io/part-of: cpemon-mvp
    cpemon.io/demo: k8sgpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8sgpt-demo-bad-image
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8sgpt-demo-bad-image
        app.kubernetes.io/part-of: cpemon-mvp
    spec:
      containers:
        - name: app
          image: ghcr.io/cpemon/missing-image:definitely-not-a-real-tag
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
