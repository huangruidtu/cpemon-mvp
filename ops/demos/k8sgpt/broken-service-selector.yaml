apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8sgpt-demo-service-target
  namespace: cpemon
  labels:
    app.kubernetes.io/name: k8sgpt-demo-service-target
    app.kubernetes.io/part-of: cpemon-mvp
    cpemon.io/demo: k8sgpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8sgpt-demo-service-target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8sgpt-demo-service-target
        app.kubernetes.io/part-of: cpemon-mvp
    spec:
      containers:
        - name: http
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: k8sgpt-demo-broken-service
  namespace: cpemon
  labels:
    app.kubernetes.io/name: k8sgpt-demo-broken-service
    app.kubernetes.io/part-of: cpemon-mvp
    cpemon.io/demo: k8sgpt
spec:
  selector:
    app.kubernetes.io/name: does-not-match-any-pod
  ports:
    - name: http
      port: 80
      targetPort: 80
