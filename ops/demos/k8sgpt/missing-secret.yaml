apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8sgpt-demo-missing-secret
  namespace: cpemon
  labels:
    app.kubernetes.io/name: k8sgpt-demo-missing-secret
    app.kubernetes.io/part-of: cpemon-mvp
    cpemon.io/demo: k8sgpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8sgpt-demo-missing-secret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8sgpt-demo-missing-secret
        app.kubernetes.io/part-of: cpemon-mvp
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: missing-cpemon-database-secret
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
