# kube-prometheus-stack values for the CPEmon dev observability stack.
#
# Ownership model:
# - Argo CD Application: k8s/gitops/dev/applications/monitoring-dev.yaml
# - Helm chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
# - Release name: kps
# - Namespace: monitoring
#
# This file intentionally keeps the platform layer small. Application-specific
# ServiceMonitors, PrometheusRules, and dashboards live in repo-owned manifests
# or the CPEmon Helm chart so they can evolve with the application.

grafana:
  adminUser: admin
  adminPassword: admin123

  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - grafana.local
    path: /
    pathType: Prefix

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

alertmanager:
  enabled: true
  config: {}

kubeControllerManager:
  enabled: true

kubeScheduler:
  enabled: true

kubeProxy:
  enabled: true

kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
