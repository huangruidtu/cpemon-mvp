apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cpemon-api-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cpemon-api-health.json: |
    {
      "id": null,
      "uid": "cpemon-api-health",
      "title": "CPEmon API Health",
      "tags": ["cpemon", "api", "red"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Request Rate by Route and Status",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(cpemon_api_http_requests_total[5m])) by (route, code)",
              "legendFormat": "{{route}} code={{code}}",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "single"}}
        },
        {
          "type": "timeseries",
          "title": "5xx Error Rate by Route",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(cpemon_api_http_requests_total{code=~\"5..\"}[5m])) by (route)",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "single"}}
        },
        {
          "type": "timeseries",
          "title": "p95 Latency by Route",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(cpemon_api_http_request_duration_seconds_bucket[5m])) by (le, route))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "single"}}
        },
        {
          "type": "timeseries",
          "title": "cpemon-api Service Up",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (service) (up{namespace=\"cpemon\", service=\"cpemon-api\"})",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "single"}}
        }
      ]
    }
