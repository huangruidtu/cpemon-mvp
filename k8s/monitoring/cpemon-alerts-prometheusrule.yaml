apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cpemon-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: cpemon.rules
      rules:
        - alert: CPEmonServiceDown
          expr: up{namespace="cpemon", service=~"acs-ingest|cpemon-writer|cpemon-api"} == 0
          for: 2m
          labels:
            severity: critical
            service: cpemon
          annotations:
            summary: "CPEmon service {{ $labels.service }} is not scrapeable"
            description: "Prometheus has not been able to scrape {{ $labels.service }} in namespace {{ $labels.namespace }} for more than 2 minutes."
            runbook_url: "ops/runbooks/monitoring-observability.md"

        - alert: CPEmonAPIHigh5xxRate
          expr: sum(rate(cpemon_api_http_requests_total{code=~"5.."}[5m])) by (route) > 0.05
          for: 10m
          labels:
            severity: warning
            service: cpemon-api
          annotations:
            summary: "High cpemon-api 5xx rate on {{ $labels.route }}"
            description: "cpemon-api route {{ $labels.route }} is returning more than 0.05 5xx responses per second for 10 minutes."
            runbook_url: "ops/runbooks/monitoring-observability.md"

        - alert: CPEmonAPIHighLatency
          expr: histogram_quantile(0.95, sum(rate(cpemon_api_http_request_duration_seconds_bucket[5m])) by (le, route)) > 1
          for: 10m
          labels:
            severity: warning
            service: cpemon-api
          annotations:
            summary: "High cpemon-api p95 latency on {{ $labels.route }}"
            description: "cpemon-api route {{ $labels.route }} has p95 latency above 1 second for 10 minutes."
            runbook_url: "ops/runbooks/monitoring-observability.md"

        - alert: CPEmonIngestErrors
          expr: sum(rate(acs_webhook_errors_total[5m])) by (reason) > 0.05
          for: 10m
          labels:
            severity: warning
            service: acs-ingest
          annotations:
            summary: "ACS ingest errors are increasing for reason {{ $labels.reason }}"
            description: "acs-ingest is reporting more than 0.05 webhook errors per second for reason {{ $labels.reason }}."
            runbook_url: "ops/runbooks/monitoring-observability.md"

        - alert: CPEmonWriterDeadLetters
          expr: sum(rate(cpemon_writer_kafka_deadletters_total{result="success"}[5m])) by (topic, kind) > 0
          for: 5m
          labels:
            severity: warning
            service: cpemon-writer
          annotations:
            summary: "cpemon-writer is publishing dead-letter events"
            description: "Dead-letter events are being published for topic {{ $labels.topic }} and kind {{ $labels.kind }}."
            runbook_url: "ops/runbooks/monitoring-observability.md"

        - alert: CPEmonKafkaMetricsDown
          expr: up{namespace="kafka"} == 0
          for: 5m
          labels:
            severity: warning
            service: kafka
          annotations:
            summary: "Kafka metrics target is down"
            description: "Prometheus cannot scrape a Kafka metrics target in namespace kafka."
            runbook_url: "ops/runbooks/monitoring-observability.md"
