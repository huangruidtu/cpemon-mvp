apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xcpemonecrrepositories.platform.cpemon.io
  labels:
    app.kubernetes.io/part-of: cpemon
    cpemon.io/story: CCPU-222
spec:
  scope: Namespaced
  group: platform.cpemon.io
  names:
    kind: XCPemonECRRepository
    plural: xcpemonecrrepositories
  defaultCompositionRef:
    name: xcpemonecrrepository.aws-ecr.standard
  enforcedCompositionRef:
    name: xcpemonecrrepository.aws-ecr.standard
  defaultCompositionUpdatePolicy: Manual
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - environment
                    - owner
                    - costCenter
                    - region
                    - resourceClass
                    - deletionPolicy
                    - repositoryNameSuffix
                  properties:
                    environment:
                      type: string
                      enum:
                        - dev
                        - staging
                        - prod
                    owner:
                      type: string
                      minLength: 2
                    costCenter:
                      type: string
                      minLength: 2
                    region:
                      type: string
                      enum:
                        - eu-north-1
                        - eu-west-1
                        - us-east-1
                    resourceClass:
                      type: string
                      enum:
                        - standard
                        - critical
                    deletionPolicy:
                      type: string
                      enum:
                        - Delete
                        - Orphan
                    repositoryNameSuffix:
                      type: string
                      pattern: "^[a-z0-9][a-z0-9-]{2,40}[a-z0-9]$"
                    imageTagMutability:
                      type: string
                      enum:
                        - IMMUTABLE
                      default: IMMUTABLE
                    scanOnPush:
                      type: boolean
                      default: true
            status:
              type: object
              properties:
                repositoryArn:
                  type: string
                repositoryUrl:
                  type: string
