apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xcpemondynamotables.platform.cpemon.io
  labels:
    app.kubernetes.io/part-of: cpemon
    cpemon.io/story: CCPU-221
spec:
  scope: Namespaced
  group: platform.cpemon.io
  names:
    kind: XCPemonDynamoTable
    plural: xcpemondynamotables
  defaultCompositionRef:
    name: xcpemondynamotable.aws-dynamodb.standard
  enforcedCompositionRef:
    name: xcpemondynamotable.aws-dynamodb.standard
  defaultCompositionUpdatePolicy: Manual
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - environment
                    - owner
                    - costCenter
                    - region
                    - resourceClass
                    - deletionPolicy
                    - tableNameSuffix
                    - partitionKey
                  properties:
                    environment:
                      type: string
                      enum:
                        - dev
                        - staging
                        - prod
                    owner:
                      type: string
                      minLength: 2
                    costCenter:
                      type: string
                      minLength: 2
                    region:
                      type: string
                      enum:
                        - eu-north-1
                        - eu-west-1
                        - us-east-1
                    resourceClass:
                      type: string
                      enum:
                        - standard
                        - critical
                    deletionPolicy:
                      type: string
                      enum:
                        - Delete
                        - Orphan
                    tableNameSuffix:
                      type: string
                      pattern: "^[a-z0-9][a-z0-9-]{2,40}[a-z0-9]$"
                    partitionKey:
                      type: string
                      pattern: "^[A-Za-z][A-Za-z0-9_]{1,60}$"
                    billingMode:
                      type: string
                      enum:
                        - PAY_PER_REQUEST
                      default: PAY_PER_REQUEST
            status:
              type: object
              properties:
                tableArn:
                  type: string
                tableName:
                  type: string
