apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8sgpt-cpemon-readonly
  namespace: cpemon
  labels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/part-of: cpemon-mvp
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8sgpt-cpemon-readonly
  namespace: cpemon
  labels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/part-of: cpemon-mvp
subjects:
  - kind: ServiceAccount
    name: k8sgpt-k8sgpt-operator-controller-manager
    namespace: k8sgpt-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8sgpt-cpemon-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8sgpt-platform-readonly
  namespace: platform
  labels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/part-of: cpemon-mvp
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8sgpt-platform-readonly
  namespace: platform
  labels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/part-of: cpemon-mvp
subjects:
  - kind: ServiceAccount
    name: k8sgpt-k8sgpt-operator-controller-manager
    namespace: k8sgpt-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8sgpt-platform-readonly
