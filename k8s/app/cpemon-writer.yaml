apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpemon-writer
  namespace: cpemon
  labels:
    app: cpemon-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpemon-writer
  template:
    metadata:
      labels:
        app: cpemon-writer
    spec:
      imagePullSecrets:
        - name: cpemon-ecr-regcred
      containers:
        - name: cpemon-writer
          image: 701573843911.dkr.ecr.eu-north-1.amazonaws.com/cpemon-writer:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: cpemon-db
                  key: dsn
            - name: HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: cpemon-app-config
                  key: HTTP_ADDR
            - name: WORKER_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: cpemon-app-config
                  key: WORKER_INTERVAL
            - name: BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: cpemon-app-config
                  key: BATCH_SIZE
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9100    # 👈 新增
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cpemon-writer
  namespace: cpemon
  labels:
    app: cpemon-writer
spec:
  selector:
    app: cpemon-writer
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
