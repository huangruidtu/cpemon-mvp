apiVersion: v1
kind: Pod
metadata:
  name: cpemon-valid-policy-fixture
  namespace: cpemon
  labels:
    app.kubernetes.io/name: cpemon
    app.kubernetes.io/instance: cpemon
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cpemon-mvp
    app.kubernetes.io/component: api
spec:
  containers:
    - name: cpemon-api
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
