apiVersion: v1
kind: Pod
metadata:
  name: cpemon-invalid-missing-labels
  namespace: cpemon
  labels:
    app.kubernetes.io/name: cpemon
spec:
  containers:
    - name: cpemon-api
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
