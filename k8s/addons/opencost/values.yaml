opencost:
  prometheus:
    internal:
      enabled: true
      serviceName: kps-kube-prometheus-stack-prometheus
      namespaceName: monitoring
      port: 9090
      path: ""
    external:
      enabled: false
  exporter:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 512Mi
  ui:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 256Mi

service:
  enabled: true
  type: ClusterIP
