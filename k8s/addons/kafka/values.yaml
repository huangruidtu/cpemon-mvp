# CPEmon Step 1 Kafka values.
#
# This file is intentionally small. Story 8 introduces the Kafka platform
# boundary first; production sizing, TLS/SASL, external access, and MSK
# migration belong to later hardening work.

controller:
  replicaCount: 1

broker:
  replicaCount: 0

kraft:
  enabled: true

listeners:
  client:
    protocol: PLAINTEXT

service:
  type: ClusterIP

externalAccess:
  enabled: false

metrics:
  jmx:
    enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: kps

volumePermissions:
  enabled: false

resourcesPreset: small

persistence:
  enabled: true
  size: 8Gi

provisioning:
  enabled: true
  topics:
    - name: cpemon.device.heartbeat.v1
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "604800000"
    - name: cpemon.wan.status.v1
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "604800000"
    - name: cpemon.deadletter.v1
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "604800000"
