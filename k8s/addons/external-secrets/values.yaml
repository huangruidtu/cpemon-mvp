# External Secrets Operator values for the CPEmon dev GitOps boundary.
#
# Secret values do not belong here. AWS secret material stays in AWS Secrets
# Manager. This file only configures the ESO controller installation.

installCRDs: true

serviceAccount:
  create: true
  name: external-secrets
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
