serviceMonitor:
  enabled: true
  additionalLabels:
    release: kps
  namespace: monitoring

grafanaDashboard:
  enabled: false

controllerManager:
  manager:
    enableResultLogging: false
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
  kubeRbacProxy:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi

dynamicRBAC:
  enabled: true
