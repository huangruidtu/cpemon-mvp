# Dev overrides for rendering and later installing the CPEmon chart.
#
# This file is safe to commit because it contains non-secret placeholders only.

global:
  namespaceOverride: cpemon
  imageTag: "__IMAGE_TAG__"

database:
  dsnSecret:
    name: cpemon-db
    key: dsn

secretRefs:
  acsHmac:
    name: cpemon-acs-hmac
    secretKey: hmac-secret

mysql:
  enabled: false
  persistence:
    create: false
    claimName: data-mysql-0

workloads:
  cpemonApi:
    replicaCount: 2
  acsIngest:
    replicaCount: 2
  cpemonWriter:
    replicaCount: 1

ingress:
  enabled: false
  host: api.local

networkPolicy:
  enabled: false

pdb:
  enabled: false

serviceMonitor:
  enabled: false
