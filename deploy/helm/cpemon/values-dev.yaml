# Dev overrides for rendering and later installing the CPEmon chart.
#
# This file is safe to commit because it contains non-secret placeholders only.

global:
  namespaceOverride: cpemon
  imageTag: "__IMAGE_TAG__"

appConfig:
  kafkaConsumerEnabled: false
  kafkaConsumerGroupId: cpemon-writer

database:
  dsnSecret:
    name: cpemon-db
    key: dsn

secretRefs:
  acsHmac:
    name: cpemon-acs-hmac
    secretKey: hmac-secret

externalSecrets:
  enabled: false
  store:
    provider:
      aws:
        region: eu-north-1
  secrets:
    db:
      remoteKey: cpemon/dev/cpemon-db
    acsHmac:
      remoteKey: cpemon/dev/cpemon-acs-hmac
    mysqlAuth:
      remoteKey: cpemon/dev/mysql-auth

mysql:
  enabled: false
  persistence:
    create: false
    claimName: data-mysql-0

workloads:
  cpemonApi:
    replicaCount: 2
  acsIngest:
    replicaCount: 2
  cpemonWriter:
    replicaCount: 1

ingress:
  enabled: false
  host: api.local

networkPolicy:
  enabled: false

pdb:
  enabled: false

serviceMonitor:
  enabled: true
