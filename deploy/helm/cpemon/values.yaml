# Default values for the CPEmon application chart.
#
# Keep this file environment-neutral. Put local or dev-only overrides in
# values-dev.yaml, and keep production secrets outside Git.

global:
  namespaceOverride: ""
  imageRegistry: "701573843911.dkr.ecr.eu-north-1.amazonaws.com"
  imageTag: "dev"
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: cpemon-ecr-regcred
  commonLabels:
    app.kubernetes.io/part-of: cpemon-mvp
    cpemon.io/layer: application

appConfig:
  configMap:
    enabled: true
    name: cpemon-app-config
  httpAddr: ":8080"
  grafanaHomeUrl: "https://grafana.local/"
  grafanaSnDashboardUrlTemplate: "https://grafana.local/d/cpemon_cpe_detail?var_sn=%s"
  kibanaHomeUrl: "http://kibana.local/app/discover#/?_g=(time:(from:now-120m,to:now))&_a=(query:(language:kuery,query:''))"
  kibanaSnLogsUrlTemplate: "http://kibana.local/app/discover#/?_g=(time:(from:now-120m,to:now))&_a=(query:(language:kuery,query:'message:\"sn=%s\"'))"

database:
  host: "mysql.cpemon.svc.cluster.local"
  port: 3306
  name: "cpemon"
  dsnSecret:
    enabled: true
    name: cpemon-db
    key: dsn

secretRefs:
  acsHmac:
    name: cpemon-acs-hmac
    secretKey: hmac-secret

externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  store:
    create: true
    kind: SecretStore
    name: cpemon-aws-secretsmanager
    provider:
      aws:
        service: SecretsManager
        region: eu-north-1
        roleArn: ""
  secrets:
    db:
      enabled: true
      name: cpemon-db
      targetName: cpemon-db
      creationPolicy: Owner
      remoteKey: cpemon/dev/cpemon-db
      data:
        - secretKey: dsn
          remoteProperty: dsn
    acsHmac:
      enabled: true
      name: cpemon-acs-hmac
      targetName: cpemon-acs-hmac
      creationPolicy: Owner
      remoteKey: cpemon/dev/cpemon-acs-hmac
      data:
        - secretKey: hmac-secret
          remoteProperty: hmac-secret
    mysqlAuth:
      enabled: true
      name: mysql-auth
      targetName: mysql-auth
      creationPolicy: Owner
      remoteKey: cpemon/dev/mysql-auth
      data:
        - secretKey: mysql-root-password
          remoteProperty: mysql-root-password
        - secretKey: mysql-username
          remoteProperty: mysql-username
        - secretKey: mysql-password
          remoteProperty: mysql-password
        - secretKey: mysql-database
          remoteProperty: mysql-database

mysql:
  enabled: false
  name: mysql
  replicaCount: 1
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  service:
    enabled: true
    type: ClusterIP
    port: 3306
  authSecret:
    name: mysql-auth
    rootPasswordKey: mysql-root-password
    usernameKey: mysql-username
    passwordKey: mysql-password
    databaseKey: mysql-database
  configMap:
    enabled: true
    name: mysql-config
    data:
      zz-custom.cnf: |
        [mysqld]
        innodb_buffer_pool_size=256M
        innodb_flush_log_at_trx_commit=1
        binlog_format=ROW
        skip-name-resolve
        max_connections=200
  persistence:
    enabled: true
    create: false
    claimName: data-mysql-0
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

defaults:
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
  ports:
    http:
      name: http
      containerPort: 8080
      servicePort: 8080
    metrics:
      name: metrics
      containerPort: 9100
      servicePort: 9100
  probes:
    enabled: true
    path: /healthz
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  env: []
  envFrom: []

workloads:
  cpemonApi:
    enabled: true
    name: cpemon-api
    component: api
    replicaCount: 2
    image:
      repository: cpemon-api
      tag: ""
      pullPolicy: ""
    env:
      - name: HTTP_ADDR
        valueFromConfig: httpAddr
      - name: GRAFANA_HOME_URL
        valueFromConfig: grafanaHomeUrl
      - name: GRAFANA_SN_DASHBOARD_URL_TEMPLATE
        valueFromConfig: grafanaSnDashboardUrlTemplate
      - name: KIBANA_HOME_URL
        valueFromConfig: kibanaHomeUrl
      - name: KIBANA_SN_LOGS_URL_TEMPLATE
        valueFromConfig: kibanaSnLogsUrlTemplate
    secretEnv:
      - name: DB_DSN
        secretName: cpemon-db
        secretKey: dsn
  acsIngest:
    enabled: true
    name: acs-ingest
    component: ingest
    replicaCount: 2
    image:
      repository: acs-ingest
      tag: ""
      pullPolicy: ""
    env:
      - name: HTTP_ADDR
        valueFromConfig: httpAddr
    secretEnv:
      - name: DB_DSN
        secretName: cpemon-db
        secretKey: dsn
      - name: HMAC_SECRET
        secretName: cpemon-acs-hmac
        secretKey: hmac-secret
  cpemonWriter:
    enabled: true
    name: cpemon-writer
    component: writer
    replicaCount: 1
    image:
      repository: cpemon-writer
      tag: ""
      pullPolicy: ""
    env:
      - name: HTTP_ADDR
        valueFromConfig: httpAddr
      - name: WORKER_INTERVAL
        value: "1s"
      - name: BATCH_SIZE
        value: "50"
    secretEnv:
      - name: DB_DSN
        secretName: cpemon-db
        secretKey: dsn

podScheduling:
  preferWorkerNodes: true
  workerNodeLabelKey: cpemon-role
  workerNodeLabelValue: worker
  tolerateControlPlane: true
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: nginx
  host: api.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  paths:
    - path: /acs/webhook
      pathType: Prefix
      workload: acsIngest
      port: http
    - path: /cpe
      pathType: Prefix
      workload: cpemonApi
      port: http
    - path: /api
      pathType: Prefix
      workload: cpemonApi
      port: http

networkPolicy:
  enabled: false
  mode: baseline
  defaultDenyEgress: true
  allowDnsEgress: true
  coreWorkloads:
    - cpemon-api
    - acs-ingest
    - cpemon-writer
  mysql:
    enabled: true
    namespace: cpemon
    podLabels:
      app: mysql
    port: 3306
  monitoring:
    enabled: true
    namespace: monitoring
    port: 9090
  logging:
    enabled: false
    namespace: logging
    port: 9200

pdb:
  enabled: false
  minAvailable: 1
  workloads:
    cpemonApi:
      enabled: true
    acsIngest:
      enabled: true
    cpemonWriter:
      enabled: false

serviceMonitor:
  enabled: false
  name: cpemon-services
  namespace: monitoring
  releaseLabel: kps
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics
