# Default values for the CPEmon application chart.
#
# Keep this file environment-neutral. Put local or dev-only overrides in
# values-dev.yaml, and keep production secrets outside Git.

global:
  namespaceOverride: ""
  imageRegistry: "701573843911.dkr.ecr.eu-north-1.amazonaws.com"
  imageTag: "dev"
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: cpemon-ecr-regcred
  commonLabels:
    app.kubernetes.io/part-of: cpemon-mvp
    cpemon.io/layer: application

appConfig:
  configMap:
    enabled: true
    name: cpemon-app-config
  httpAddr: ":8080"
  grafanaHomeUrl: "https://grafana.local/"
  grafanaSnDashboardUrlTemplate: "https://grafana.local/d/cpemon_cpe_detail?var_sn=%s"
  kibanaHomeUrl: "http://kibana.local/app/discover#/?_g=(time:(from:now-120m,to:now))&_a=(query:(language:kuery,query:''))"
  kibanaSnLogsUrlTemplate: "http://kibana.local/app/discover#/?_g=(time:(from:now-120m,to:now))&_a=(query:(language:kuery,query:'message:\"sn=%s\"'))"

database:
  host: "mysql.cpemon.svc.cluster.local"
  port: 3306
  name: "cpemon"
  dsnSecret:
    enabled: true
    name: cpemon-db
    key: dsn

secretRefs:
  acsHmac:
    name: cpemon-acs-hmac
    secretKey: hmac-secret

defaults:
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
  ports:
    http:
      name: http
      containerPort: 8080
      servicePort: 8080
    metrics:
      name: metrics
      containerPort: 9100
      servicePort: 9100
  probes:
    enabled: true
    path: /healthz
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  env: []
  envFrom: []

workloads:
  cpemonApi:
    enabled: true
    name: cpemon-api
    component: api
    replicaCount: 2
    image:
      repository: cpemon-api
      tag: ""
      pullPolicy: ""
    env:
      - name: HTTP_ADDR
        valueFromConfig: httpAddr
      - name: GRAFANA_HOME_URL
        valueFromConfig: grafanaHomeUrl
      - name: GRAFANA_SN_DASHBOARD_URL_TEMPLATE
        valueFromConfig: grafanaSnDashboardUrlTemplate
      - name: KIBANA_HOME_URL
        valueFromConfig: kibanaHomeUrl
      - name: KIBANA_SN_LOGS_URL_TEMPLATE
        valueFromConfig: kibanaSnLogsUrlTemplate
    secretEnv:
      - name: DB_DSN
        secretName: cpemon-db
        secretKey: dsn
  acsIngest:
    enabled: true
    name: acs-ingest
    component: ingest
    replicaCount: 2
    image:
      repository: acs-ingest
      tag: ""
      pullPolicy: ""
    env:
      - name: HTTP_ADDR
        valueFromConfig: httpAddr
    secretEnv:
      - name: DB_DSN
        secretName: cpemon-db
        secretKey: dsn
      - name: HMAC_SECRET
        secretName: cpemon-acs-hmac
        secretKey: hmac-secret
  cpemonWriter:
    enabled: true
    name: cpemon-writer
    component: writer
    replicaCount: 1
    image:
      repository: cpemon-writer
      tag: ""
      pullPolicy: ""
    env:
      - name: HTTP_ADDR
        valueFromConfig: httpAddr
      - name: WORKER_INTERVAL
        value: "1s"
      - name: BATCH_SIZE
        value: "50"
    secretEnv:
      - name: DB_DSN
        secretName: cpemon-db
        secretKey: dsn

podScheduling:
  preferWorkerNodes: true
  workerNodeLabelKey: cpemon-role
  workerNodeLabelValue: worker
  tolerateControlPlane: true
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: alb
  host: ""
  annotations: {}

networkPolicy:
  enabled: false
  mode: baseline

pdb:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
