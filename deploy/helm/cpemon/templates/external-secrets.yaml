{{- if .Values.externalSecrets.enabled }}
{{- $root := . -}}
{{- $eso := .Values.externalSecrets -}}
{{- range $key, $secret := $eso.secrets }}
{{- if $secret.enabled }}
---
apiVersion: {{ $eso.apiVersion | quote }}
kind: ExternalSecret
metadata:
  name: {{ $secret.name | quote }}
  namespace: {{ include "cpemon.namespace" $root | quote }}
  labels:
    {{- include "cpemon.labels" $root | nindent 4 }}
    cpemon.io/secret-contract: {{ $key | quote }}
spec:
  refreshInterval: {{ $eso.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $eso.store.name | quote }}
    kind: {{ $eso.store.kind | quote }}
  target:
    name: {{ $secret.targetName | quote }}
    creationPolicy: {{ $secret.creationPolicy | quote }}
  data:
    {{- range $item := $secret.data }}
    - secretKey: {{ $item.secretKey | quote }}
      remoteRef:
        key: {{ $secret.remoteKey | quote }}
        {{- with $item.remoteProperty }}
        property: {{ . | quote }}
        {{- end }}
        {{- with $item.remoteVersion }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
