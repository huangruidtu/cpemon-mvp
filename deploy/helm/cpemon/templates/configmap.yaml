{{- if .Values.appConfig.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cpemon.configMapName" . | quote }}
  namespace: {{ include "cpemon.namespace" . | quote }}
  labels:
{{ include "cpemon.labels" . | nindent 4 }}
data:
  HTTP_ADDR: {{ .Values.appConfig.httpAddr | quote }}
  GRAFANA_HOME_URL: {{ .Values.appConfig.grafanaHomeUrl | quote }}
  GRAFANA_SN_DASHBOARD_URL_TEMPLATE: {{ .Values.appConfig.grafanaSnDashboardUrlTemplate | quote }}
  KIBANA_HOME_URL: {{ .Values.appConfig.kibanaHomeUrl | quote }}
  KIBANA_SN_LOGS_URL_TEMPLATE: {{ .Values.appConfig.kibanaSnLogsUrlTemplate | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.appConfig.kafkaBootstrapServers | quote }}
  KAFKA_TOPIC_DEVICE_HEARTBEAT: {{ .Values.appConfig.kafkaTopicDeviceHeartbeat | quote }}
  KAFKA_TOPIC_WAN_STATUS: {{ .Values.appConfig.kafkaTopicWanStatus | quote }}
  KAFKA_TOPIC_DEADLETTER: {{ .Values.appConfig.kafkaTopicDeadletter | quote }}
  KAFKA_PRODUCER_ENABLED: {{ .Values.appConfig.kafkaProducerEnabled | quote }}
  KAFKA_PRODUCER_TIMEOUT: {{ .Values.appConfig.kafkaProducerTimeout | quote }}
  KAFKA_PRODUCER_MAX_RETRIES: {{ .Values.appConfig.kafkaProducerMaxRetries | quote }}
  KAFKA_CONSUMER_ENABLED: {{ .Values.appConfig.kafkaConsumerEnabled | quote }}
  KAFKA_CONSUMER_GROUP_ID: {{ .Values.appConfig.kafkaConsumerGroupId | quote }}
  KAFKA_CONSUMER_READ_TIMEOUT: {{ .Values.appConfig.kafkaConsumerReadTimeout | quote }}
  KAFKA_CONSUMER_COMMIT_TIMEOUT: {{ .Values.appConfig.kafkaConsumerCommitTimeout | quote }}
  KAFKA_CONSUMER_MAX_RETRIES: {{ .Values.appConfig.kafkaConsumerMaxRetries | quote }}
  KAFKA_CONSUMER_RETRY_BACKOFF: {{ .Values.appConfig.kafkaConsumerRetryBackoff | quote }}
{{- end }}
