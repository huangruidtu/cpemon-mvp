name: Build and push Docker images to ECR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1

jobs:
  build-and-push:
    name: Build and push service images
    runs-on: ubuntu-latest
    env:
      ECR_PUSH_ROLE_ARN: ${{ secrets.CPEMON_ECR_PUSH_ROLE_ARN }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: acs-ingest
            dockerfile: docker/Dockerfile.acs-ingest
          - name: cpemon-api
            dockerfile: docker/Dockerfile.cpemon-api
          - name: cpemon-writer
            dockerfile: docker/Dockerfile.cpemon-writer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ECR push role secret
        if: env.ECR_PUSH_ROLE_ARN == ''
        run: |
          echo "CPEMON_ECR_PUSH_ROLE_ARN is not configured."
          echo "Create/import the GitHub OIDC ECR push role with Terraform before publishing images."
          exit 1

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "IMAGE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_VERSION=manual-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          fi

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: ${{ matrix.service.name }}
          DOCKERFILE: ${{ matrix.service.dockerfile }}
        run: |
          docker build \
            -f "$DOCKERFILE" \
            -t "$ECR_REGISTRY/$IMAGE_NAME:latest" \
            -t "$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_VERSION" \
            .

      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: ${{ matrix.service.name }}
        run: |
          docker push "$ECR_REGISTRY/$IMAGE_NAME:latest"
          docker push "$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_VERSION"
